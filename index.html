  /* dim/vignette so the photo never fights with the text */
  .scrim {
    position: absolute;
    inset: 0;
    z-index: 1;
    background:
      linear-gradient(180deg, rgba(3,3,5,0.72) 0%, rgba(3,3,5,0.35) 30%, rgba(3,3,5,0.45) 60%, rgba(3,3,5,0.85) 100%);
  }

  .frame-svg {
    position: absolute;
    inset: 0;
    z-index: 3;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .content {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 46px 30px 28px;
  }

  .top { text-align: center; margin-top: 8px; }

  .title-plate {
    display: inline-block;
    background: var(--panel);
    border: 1px solid var(--gold-dim);
    padding: 14px 18px 16px;
  }

  .eyebrow {
    font-family: 'VT323', monospace;
    font-size: 16px;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 0 0 8px;
  }

  h1 {
    font-family: 'Press Start 2P', monospace;
    font-size: 22px;
    line-height: 1.6;
    margin: 0;
    color: #F6EFDC;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.9);
  }

  h1 .sub {
    display: block;
    font-family: 'VT323', monospace;
    font-size: 17px;
    font-weight: 400;
    color: var(--gold-bright);
    margin-top: 10px;
    letter-spacing: 0.03em;
  }

  .tagline-plate {
    display: inline-block;
    background: var(--panel);
    border: 1px solid rgba(122,97,28,0.5);
    padding: 10px 16px;
    margin: 14px auto 0;
    max-width: 300px;
  }

  .tagline {
    color: var(--muted);
    font-size: 16px;
    line-height: 1.4;
    margin: 0;
  }

  .tagline strong {
    color: var(--gold-bright);
  }

  nav {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 18px;
  }

  .menu-item {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 14px 10px;
    background: var(--panel-solid);
    border: 1px solid var(--gold-dim);
    cursor: pointer;
    text-align: center;
  }

  .menu-item .label {
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    letter-spacing: 0.02em;
    color: #D9CFB4;
    transition: color 0.15s ease;
  }

  .menu-item:hover,
  .menu-item.selected {
    border-color: var(--gold-bright);
    background: #16130A;
  }

  .menu-item:hover .label,
  .menu-item.selected .label {
    color: var(--gold-bright);
  }

  .menu-item.selected::before {
    content: "▸";
    position: absolute;
    left: 12px;
    color: var(--gold-bright);
    font-family: 'VT323', monospace;
    font-size: 20px;
  }

  footer {
    display: flex;
    align-items: flex-end;
    justify-content: flex-end;
    margin-top: 18px;
    gap: 10px;
  }

  .credit {
    font-family: 'VT323', monospace;
    font-size: 14px;
    color: var(--muted);
    line-height: 1.4;
    max-width: 220px;
    margin: 0;
    background: var(--panel);
    border: 1px solid rgba(122,97,28,0.4);
    padding: 6px 10px;
  }

  .version {
    font-family: 'VT323', monospace;
    font-size: 14px;
    color: var(--gold-bright);
    background: var(--panel);
    border: 1px solid rgba(122,97,28,0.4);
    padding: 6px 10px;
    white-space: nowrap;
  }
</style>
</head>

        <stop offset="0%" stop-color="#7A611C"/>

        <stop offset="100%" stop-color="#7A611C"/>
      </linearGradient>
    </defs>

    <rect x="10" y="10" width="460" height="880" fill="none" stroke="url(#goldline)" stroke-width="1.4" opacity="0.75"/>
    <rect x="15" y="15" width="450" height="870" fill="none" stroke="url(#goldline)" stroke-width="0.6" opacity="0.4"/>

    <g stroke="url(#goldline)" stroke-width="1.4" fill="none" opacity="0.85">

  <div class="content">

    <div class="top">
      <div class="title-plate">
        <h1>Wonders

      </div>
    </div>

    <nav>
      <div class="menu-item selected"><span class="label">Roleplay</span></div>

      <div class="menu-item"><span class="label">Settings</span></div>
    </nav>

    <footer>
      <span class="version">ver. 0.1</span>
    </footer>

  </div>

</div>

</html>
